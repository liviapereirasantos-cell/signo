<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra seu Signo Zodiacal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f0a1f;
            color: #e2e8f0;
            min-height: 100vh;
            margin: 0;
        }

        .navbar {
            background: linear-gradient(135deg, #4c1d95, #7c3aed, #c026d3) !important;
        }

        .hero {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 20% 50%, rgba(124, 58, 237, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(192, 38, 211, 0.2) 0%, transparent 40%),
                #0f0a1f;
            padding: 2rem 1rem;
        }

        .card-cosmic {
            background: rgba(30, 27, 75, 0.95);
            border: 1px solid rgba(124, 58, 237, 0.4);
            border-radius: 1.25rem;
            max-width: 480px;
            width: 100%;
        }

        .text-gradient {
            background: linear-gradient(135deg, #4c1d95, #7c3aed, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .icon-grande {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #4c1d95, #7c3aed, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-control {
            background: rgba(15, 10, 31, 0.8);
            border: 1px solid rgba(124, 58, 237, 0.5);
            color: #fff;
            border-radius: 0.75rem;
        }

        .form-control:focus {
            background: rgba(15, 10, 31, 0.95);
            border-color: #7c3aed;
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.3);
        }

        .form-label {
            color: #c4b5fd;
        }

        .btn-cosmic {
            background: linear-gradient(135deg, #4c1d95, #7c3aed, #c026d3);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 0.75rem;
            padding: 0.75rem 1.5rem;
            width: 100%;
            cursor: pointer;
        }

        .btn-cosmic:hover {
            color: #fff;
            opacity: 0.9;
        }

        .info-box {
            background: rgba(30, 27, 75, 0.85);
            border-radius: 1rem;
            border: 1px solid rgba(124, 58, 237, 0.25);
            padding: 1rem;
        }

        .badge-signo {
            background: rgba(124, 58, 237, 0.3);
            color: #e9d5ff;
            border: 1px solid rgba(124, 58, 237, 0.5);
            padding: 0.35rem 0.8rem;
            border-radius: 50rem;
            font-weight: 500;
            display: inline-block;
            margin: 0.2rem;
            font-size: 0.9rem;
        }

        .text-muted-cosmic {
            color: #a5b4fc !important;
        }

        #resultado {
            display: none;
        }

        .result-card {
            background: rgba(30, 27, 75, 0.95);
            border: 1px solid rgba(124, 58, 237, 0.4);
            border-radius: 1.25rem;
            max-width: 700px;
            width: 100%;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="bi bi-stars me-2"></i>Zodíaco</span>
        </div>
    </nav>

    <!-- FORMULÁRIO -->
    <div class="hero" id="formulario">
        <div class="card card-cosmic shadow-lg">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-grande mb-3"><i class="bi bi-moon-stars-fill"></i></div>
                    <h1 class="h3 fw-bold text-gradient">Descubra seu Signo</h1>
                    <p class="text-muted-cosmic mb-0">Informe sua data de nascimento</p>
                </div>

                <div class="mb-4">
                    <label for="dataNascimento" class="form-label fw-semibold">
                        <i class="bi bi-calendar3 me-1"></i> Data de Nascimento
                    </label>
                    <input type="date" id="dataNascimento" class="form-control form-control-lg">
                </div>

                <button type="button" class="btn btn-cosmic btn-lg" id="btnDescobrir">
                    <i class="bi bi-search me-2"></i>Descobrir meu Signo
                </button>
            </div>
        </div>
    </div>

    <!-- RESULTADO -->
    <div class="hero" id="resultado">
        <div class="result-card shadow-lg p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="icon-grande display-1 mb-2" id="simbolo"></div>
                <h1 class="display-5 fw-bold text-gradient" id="nomeSigno"></h1>
                <p class="lead text-muted-cosmic mb-1">Nascido em <strong id="dataExibida"></strong></p>
                <p class="text-secondary mb-0">Período: <span id="periodo"></span></p>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-4">
                    <div class="info-box text-center h-100">
                        <i class="bi bi-fire text-danger fs-4 d-block mb-1"></i>
                        <small class="text-uppercase text-muted-cosmic d-block">Elemento</small>
                        <strong id="elemento"></strong>
                    </div>
                </div>
                <div class="col-4">
                    <div class="info-box text-center h-100">
                        <i class="bi bi-diamond text-primary fs-4 d-block mb-1"></i>
                        <small class="text-uppercase text-muted-cosmic d-block">Qualidade</small>
                        <strong id="qualidade"></strong>
                    </div>
                </div>
                <div class="col-4">
                    <div class="info-box text-center h-100">
                        <i class="bi bi-globe2 text-success fs-4 d-block mb-1"></i>
                        <small class="text-uppercase text-muted-cosmic d-block">Planeta</small>
                        <strong id="planeta"></strong>
                    </div>
                </div>
            </div>

            <div class="info-box mb-3">
                <h5 class="fw-bold mb-2"><i class="bi bi-book me-2" style="color:#7c3aed"></i>Sobre o signo</h5>
                <p class="mb-0" id="descricao"></p>
            </div>

            <div class="info-box mb-3">
                <h5 class="fw-bold mb-2"><i class="bi bi-list-check me-2" style="color:#7c3aed"></i>Características</h5>
                <div id="caracteristicas"></div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="info-box h-100">
                        <h5 class="fw-bold mb-2"><i class="bi bi-heart text-danger me-2"></i>Compatibilidade</h5>
                        <p class="mb-0" id="compatibilidade"></p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="info-box text-center h-100">
                        <small class="text-uppercase text-muted-cosmic d-block mb-1">Cor</small>
                        <strong id="cor"></strong>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="info-box text-center h-100">
                        <small class="text-uppercase text-muted-cosmic d-block mb-1">Pedra</small>
                        <strong id="pedra"></strong>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-cosmic btn-lg" id="btnVoltar">
                <i class="bi bi-arrow-left me-2"></i>Consultar outra data
            </button>
        </div>
    </div>

    <script>
        var signos = [
            {
                nome: "Áries", simbolo: "♈", inicio: [3, 21], fim: [4, 19], elemento: "Fogo", qualidade: "Cardinal", planeta: "Marte",
                descricao: "Áries é o primeiro signo do zodíaco, representando o início, a coragem e a impulsividade. Pessoas de Áries são líderes naturais, cheias de energia e iniciativa.",
                caracteristicas: ["Corajoso", "Determinado", "Confiante", "Entusiasta", "Otimista", "Honesto", "Impaciente", "Temperamental"],
                compatibilidade: "Leão, Sagitário, Gêmeos, Aquário", cor: "Vermelho", pedra: "Diamante"
            },

            {
                nome: "Touro", simbolo: "♉", inicio: [4, 20], fim: [5, 20], elemento: "Terra", qualidade: "Fixo", planeta: "Vênus",
                descricao: "Touro é um signo de terra, associado à estabilidade, sensualidade e perseverança. Tauriinos valorizam o conforto, a beleza e a segurança material.",
                caracteristicas: ["Paciente", "Confiável", "Devotado", "Responsável", "Estável", "Teimoso", "Possessivo", "Materialista"],
                compatibilidade: "Virgem, Capricórnio, Câncer, Peixes", cor: "Verde", pedra: "Esmeralda"
            },

            {
                nome: "Gêmeos", simbolo: "♊", inicio: [5, 21], fim: [6, 20], elemento: "Ar", qualidade: "Mutável", planeta: "Mercúrio",
                descricao: "Gêmeos é o signo da dualidade, da comunicação e da curiosidade intelectual. Geminianos são versáteis, sociáveis e sempre em busca de novas experiências.",
                caracteristicas: ["Adaptável", "Curioso", "Comunicativo", "Espirituoso", "Intelectual", "Nervoso", "Inconsistente", "Superficial"],
                compatibilidade: "Libra, Aquário, Áries, Leão", cor: "Amarelo", pedra: "Ágata"
            },

            {
                nome: "Câncer", simbolo: "♋", inicio: [6, 21], fim: [7, 22], elemento: "Água", qualidade: "Cardinal", planeta: "Lua",
                descricao: "Câncer é o signo lunar, profundamente ligado às emoções, ao lar e à proteção familiar. Cancerianos são intuitivos, cuidadosos e extremamente leais.",
                caracteristicas: ["Emotivo", "Intuitivo", "Protetor", "Leal", "Compassivo", "Temperamental", "Inseguro", "Manipulado"],
                compatibilidade: "Escorpião, Peixes, Touro, Virgem", cor: "Prata / Branco", pedra: "Pérola"
            },

            {
                nome: "Leão", simbolo: "♌", inicio: [7, 23], fim: [8, 22], elemento: "Fogo", qualidade: "Fixo", planeta: "Sol",
                descricao: "Leão é o signo do sol, da criatividade, do orgulho e da generosidade. Leoninos brilham em qualquer ambiente e gostam de ser o centro das atenções.",
                caracteristicas: ["Criativo", "Apaixonado", "Generoso", "Caloroso", "Alegre", "Arrogante", "Teimoso", "Dominante"],
                compatibilidade: "Áries, Sagitário, Gêmeos, Libra", cor: "Dourado / Laranja", pedra: "Rubi"
            },

            {
                nome: "Virgem", simbolo: "♍", inicio: [8, 23], fim: [9, 22], elemento: "Terra", qualidade: "Mutável", planeta: "Mercúrio",
                descricao: "Virgem é o signo da análise, do perfeccionismo e do serviço. Virginianos são práticos, detalhistas e buscam a excelência em tudo o que fazem.",
                caracteristicas: ["Analítico", "Trabalhador", "Prático", "Modesto", "Confiável", "Crítico", "Perfeccionista", "Preocupado"],
                compatibilidade: "Touro, Capricórnio, Câncer, Escorpião", cor: "Bege / Marrom", pedra: "Safira"
            },

            {
                nome: "Libra", simbolo: "♎", inicio: [9, 23], fim: [10, 22], elemento: "Ar", qualidade: "Cardinal", planeta: "Vênus",
                descricao: "Libra é o signo do equilíbrio, da harmonia e dos relacionamentos. Librianos valorizam a justiça, a beleza e a diplomacia.",
                caracteristicas: ["Diplomático", "Justo", "Sociável", "Charmoso", "Idealista", "Indeciso", "Evitador de conflitos", "Superficial"],
                compatibilidade: "Gêmeos, Aquário, Leão, Sagitário", cor: "Rosa / Azul claro", pedra: "Opala"
            },

            {
                nome: "Escorpião", simbolo: "♏", inicio: [10, 23], fim: [11, 21], elemento: "Água", qualidade: "Fixo", planeta: "Plutão / Marte",
                descricao: "Escorpião é um signo intenso, misterioso e transformador. Escorpianos são profundos, apaixonados e possuem grande poder de regeneração.",
                caracteristicas: ["Intenso", "Apaixonado", "Determinado", "Intuitivo", "Leal", "Ciumento", "Secreto", "Vingativo"],
                compatibilidade: "Câncer, Peixes, Virgem, Capricórnio", cor: "Preto / Vermelho escuro", pedra: "Topázio"
            },

            {
                nome: "Sagitário", simbolo: "♐", inicio: [11, 22], fim: [12, 21], elemento: "Fogo", qualidade: "Mutável", planeta: "Júpiter",
                descricao: "Sagitário é o signo da liberdade, da aventura e da filosofia. Sagitarianos são otimistas, honestos e sempre em busca de expansão e conhecimento.",
                caracteristicas: ["Otimista", "Aventureiro", "Honesto", "Filosófico", "Generoso", "Impaciente", "Irresponsável", "Indelicado"],
                compatibilidade: "Áries, Leão, Libra, Aquário", cor: "Roxo / Azul", pedra: "Turquesa"
            },

            {
                nome: "Capricórnio", simbolo: "♑", inicio: [12, 22], fim: [1, 19], elemento: "Terra", qualidade: "Cardinal", planeta: "Saturno",
                descricao: "Capricórnio é o signo da ambição, da disciplina e da responsabilidade. Capricornianos são persistentes, práticos e focados em alcançar seus objetivos a longo prazo.",
                caracteristicas: ["Disciplinado", "Responsável", "Ambicioso", "Paciente", "Prático", "Pessimista", "Rígido", "Distante"],
                compatibilidade: "Touro, Virgem, Escorpião, Peixes", cor: "Marrom / Preto", pedra: "Ônix"
            },

            {
                nome: "Aquário", simbolo: "♒", inicio: [1, 20], fim: [2, 18], elemento: "Ar", qualidade: "Fixo", planeta: "Urano / Saturno",
                descricao: "Aquário é o signo da inovação, da liberdade e do humanitarismo. Aquarianos são originais, independentes e sempre à frente do seu tempo.",
                caracteristicas: ["Original", "Independente", "Humanitário", "Intelectual", "Amigável", "Imprevisível", "Distante", "Rebelde"],
                compatibilidade: "Gêmeos, Libra, Áries, Sagitário", cor: "Azul elétrico / Turquesa", pedra: "Ametista"
            },

            {
                nome: "Peixes", simbolo: "♓", inicio: [2, 19], fim: [3, 20], elemento: "Água", qualidade: "Mutável", planeta: "Netuno / Júpiter",
                descricao: "Peixes é o signo da sensibilidade, da intuição e da compaixão. Piscianos são sonhadores, artísticos e profundamente empáticos.",
                caracteristicas: ["Compassivo", "Artístico", "Intuitivo", "Gentil", "Sábio", "Escapista", "Idealista", "Vítima"],
                compatibilidade: "Câncer, Escorpião, Touro, Capricórnio", cor: "Verde-água / Lilás", pedra: "Aquamarine"
            }
        ];

        function descobrirSigno() {
            var input = document.getElementById("dataNascimento");
            var valor = input.value;

            if (!valor || valor === "") {
                alert("Por favor, selecione uma data de nascimento.");
                return;
            }

            var partes = valor.split("-");
            var mes = parseInt(partes[1], 10);
            var dia = parseInt(partes[2], 10);

            var signoEncontrado = null;

            for (var i = 0; i < signos.length; i++) {
                var s = signos[i];
                var mi = s.inicio[0];
                var di = s.inicio[1];
                var mf = s.fim[0];
                var df = s.fim[1];

                if (s.nome === "Capricórnio") {
                    if ((mes === 12 && dia >= 22) || (mes === 1 && dia <= 19)) {
                        signoEncontrado = s;
                        break;
                    }
                }
                else {
                    if ((mes === mi && dia >= di) || (mes === mf && dia <= df)) {
                        signoEncontrado = s;
                        break;
                    }
                }
            }

            if (!signoEncontrado) {
                alert("Não foi possível identificar o signo para esta data.");
                return;
            }

            document.getElementById("simbolo").textContent = signoEncontrado.simbolo;
            document.getElementById("nomeSigno").textContent = signoEncontrado.nome;
            document.getElementById("dataExibida").textContent = partes[2] + "/" + partes[1] + "/" + partes[0];

            var pIni = ("0" + signoEncontrado.inicio[1]).slice(-2) + "/" + ("0" + signoEncontrado.inicio[0]).slice(-2);
            var pFim = ("0" + signoEncontrado.fim[1]).slice(-2) + "/" + ("0" + signoEncontrado.fim[0]).slice(-2);
            document.getElementById("periodo").textContent = pIni + " a " + pFim;

            document.getElementById("elemento").textContent = signoEncontrado.elemento;
            document.getElementById("qualidade").textContent = signoEncontrado.qualidade;
            document.getElementById("planeta").textContent = signoEncontrado.planeta;
            document.getElementById("descricao").textContent = signoEncontrado.descricao;
            document.getElementById("compatibilidade").textContent = signoEncontrado.compatibilidade;
            document.getElementById("cor").textContent = signoEncontrado.cor;
            document.getElementById("pedra").textContent = signoEncontrado.pedra;

            var container = document.getElementById("caracteristicas");
            container.innerHTML = "";
            for (var j = 0; j < signoEncontrado.caracteristicas.length; j++) {
                var span = document.createElement("span");
                span.className = "badge-signo";
                span.textContent = signoEncontrado.caracteristicas[j];
                container.appendChild(span);
            }

            document.getElementById("formulario").style.display = "none";
            document.getElementById("resultado").style.display = "flex";
            window.scrollTo(0, 0);
        }

        function voltar() {
            document.getElementById("resultado").style.display = "none";
            document.getElementById("formulario").style.display = "flex";
            document.getElementById("dataNascimento").value = "";
        }

        document.getElementById("btnDescobrir").onclick = descobrirSigno;
        document.getElementById("btnVoltar").onclick = voltar;

        document.getElementById("dataNascimento").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                descobrirSigno();
            }
        });
    </script>
</body>

</html>
